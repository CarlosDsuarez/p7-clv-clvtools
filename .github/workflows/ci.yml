# archivo: .github/workflows/ci.yml
name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Dependencias del sistema (GSL para CLVTools, GLPK para igraph)
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev libglpk-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
